
[weapons]
	#If true, treat any item whose registry path contains 'sword' as a sword for sword-based styles (swordsman, santoryu, nitoryu, hasshoken).
	match_registry_name_contains_sword = false
	#Default Art of Weather level for non-Clima Tact allowlisted items (1-3).
	#Higher levels unlock more abilities. 3 equals Sorcery Clima Tact.
	#Range: 1 ~ 3
	art_of_weather_default_level = 3
	#If true, show bonus tooltips for fighting styles on the client.
	enable_bonus_tooltips = true

	#Items that receive bonus tooltips for Dagger style (Cart Addon)
	[weapons.dagger]
		#Extra items that should receive the Dagger bonuses. Accepts list entries or comma-separated values (modid:itemid).
		item_whitelist = []
		#Items that should NOT receive the Dagger bonuses (modid:itemid).
		item_blacklist = []

